[DEFAULT]
# All sections below are required unless otherwise specified.
# See https://github.com/fastai/nbdev/blob/master/settings.ini for examples.

### Python library ###
repo = sparsevnn
lib_name = %(repo)s
version = 0.0.1
min_python = 3.7
license = apache2
black_formatting = False

### nbdev ###
doc_path = _docs
lib_path = sparsevnn
nbs_path = nbs
recursive = True
tst_flags = notest
put_version_in_init = True

### Docs ###
branch = main
custom_sidebar = False
doc_host = https://%(user)s.github.io
doc_baseurl = /%(repo)s
git_url = https://github.com/%(user)s/%(repo)s
title = %(lib_name)s

### PyPI ###
audience = Developers
author = daniel.kick
author_email = daniel.kick@usda.gov
copyright = 2024 onwards, %(author)s
description = Python library for producing visual neural networks using sparse linear layers to speed up model fitting.
keywords = nbdev jupyter notebook python
language = English
status = 3
user = DanielKick-USDA

