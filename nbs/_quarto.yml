ipynb-filters: [nbdev_filter]

project:
  type: website
  output-dir: _docs
  preview:
    port: 3000
    browser: false

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 4

website:
  title: "sparsevnn"
  site-url: "https://DanielKick-USDA.github.io/sparsevnn"
  description: "Python library for producing visual neural networks using sparse linear layers to speed up model fitting."
  twitter-card: true
  open-graph: true
  repo-branch: main
  repo-url: "https://github.com/DanielKick-USDA/sparsevnn"
  repo-actions: [issue]
  navbar:
    background: primary
    search: true
    right:
      - icon: github
        href: "https://github.com/DanielKick-USDA/sparsevnn"
  sidebar:
    style: "floating"

metadata-files: 
  - sidebar.yml
  - custom.yml
